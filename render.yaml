services:
  - type: web
    name: sistem-donasi-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend-donasi
    buildCommand: npm ci
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health/db
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://yayasanmuliakaryabersama.netlify.app
      - key: DEMO_MODE
        value: "true"
